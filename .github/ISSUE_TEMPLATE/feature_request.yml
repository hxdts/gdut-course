name: 功能建议
description: 想要什么新功能，或者觉得哪里可以做得更好
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: 你想要什么
      description: 描述清楚你希望 App 变成什么样
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 为什么需要
      description: 现在怎么用的、哪里不方便
    validations:
      required: false

  - type: textarea
    id: shot
    attributes:
      label: 参考图（可选）
      description: 别的 App 长什么样、手绘草图都行
    validations:
      required: false
